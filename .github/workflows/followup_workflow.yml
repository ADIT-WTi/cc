# ============================================================
#         FOLLOWUP WORKFLOW — EMAIL 2
# ============================================================
# Trigger 1: Push to data/Not_Found_Summary.xlsx (auto)
# Trigger 2: Manual from GitHub Actions UI (testing)
#
# Steps:
#   1. Checkout repository
#   2. Setup Python + dependencies
#   3. Check if Email 2 is needed
#   4. Update master file from Not Found Summary
#   5. Reprocess invoice data with updated master
#   6. Generate fresh CRD report (no Not Found sheet)
#   7. Send Email 2
#   8. Commit all files
# ============================================================

name: CRD Report — Followup Workflow (Email 2)

on:
  push:
    paths:
      - "data/Not_Found_Summary.xlsx"

  workflow_dispatch:
    inputs:
      test_mode:
        description: |
          TEST MODE
          true  = Manual test run
          false = Production run
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  send-final-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:

      # ── Step 1: Checkout Repository ──────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Step 2: Setup Python ──────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Step 3: Install Dependencies ──────────────────────
      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Check If Email 2 Is Needed ────────────────
      - name: 🔍 Check State File
        id: check_state
        run: |
          python - <<'EOF'
          import json, os, sys

          state_path = "reports/.run_state.json"
          event_name = os.environ.get(
              "GITHUB_EVENT_NAME", ""
          )
          print(f"Event type : {event_name}")

          # Manual trigger — always run
          if event_name == "workflow_dispatch":
              print(
                  "✅ Manual trigger — "
                  "forcing Email 2 flow."
              )
              with open(
                  os.environ["GITHUB_OUTPUT"], "a"
              ) as f:
                  f.write("needs_email2=true\n")
              sys.exit(0)

          # Auto trigger — check state
          if not os.path.exists(state_path):
              print("No state file. Skipping.")
              with open(
                  os.environ["GITHUB_OUTPUT"], "a"
              ) as f:
                  f.write("needs_email2=false\n")
              sys.exit(0)

          with open(state_path) as f:
              state = json.load(f)

          has_not_found = state.get("has_not_found", False)
          email2_sent   = state.get("email2_sent",   False)
          nf_exists     = os.path.exists(
              "data/Not_Found_Summary.xlsx"
          )

          print(f"has_not_found  : {has_not_found}")
          print(f"email2_sent    : {email2_sent}")
          print(f"NF file exists : {nf_exists}")

          if has_not_found and not email2_sent and nf_exists:
              print("✅ Email 2 required.")
              with open(
                  os.environ["GITHUB_OUTPUT"], "a"
              ) as f:
                  f.write("needs_email2=true\n")
          else:
              print("ℹ️  Email 2 not required.")
              with open(
                  os.environ["GITHUB_OUTPUT"], "a"
              ) as f:
                  f.write("needs_email2=false\n")
          EOF

      # ── Step 5: Update Master File ────────────────────────
      - name: 🔄 Update Master from Not Found Summary
        if: steps.check_state.outputs.needs_email2 == 'true'
        run: |
          echo "============================================"
          echo "  STEP 1: UPDATING MASTER FILE"
          echo "============================================"
          python scripts/update_master.py

      # ── Step 5b: Download Complete Data Artifact ──────────
      # The parquet no longer lives in git — it travels as the
      # `combined-data-latest` artifact published by the Main
      # Workflow. Download and restore it to the state path
      # so reprocess_combined.py finds it.
      - name: 📥 Download Complete Data Artifact
        if: steps.check_state.outputs.needs_email2 == 'true'
        id: download_data
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const ARTIFACT_NAME = 'combined-data-latest';

            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
              name: ARTIFACT_NAME,
            });

            if (!data.artifacts || data.artifacts.length === 0) {
              core.setOutput('found', 'false');
              core.warning(
                `Artifact '${ARTIFACT_NAME}' not found (expired or not uploaded yet). ` +
                `Will fall back to parquet in checkout if present.`
              );
              return;
            }

            const latest = data.artifacts.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at)
            )[0];

            console.log(
              `Found artifact: id=${latest.id} size=${latest.size_in_bytes} ` +
              `run=${latest.workflow_run ? latest.workflow_run.id : '?'} ` +
              `expires=${latest.expires_on}`
            );

            const zip = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: latest.id,
              archive_format: 'zip',
            });

            // NOTE: the API returns the artifact as a ZIP
            // archive — save it as .zip, the next step
            // extracts the parquet from it.
            fs.mkdirSync('_dl', { recursive: true });
            fs.writeFileSync('_dl/artifact.zip', Buffer.from(zip.data));
            console.log(`Saved artifact zip: ${Buffer.from(zip.data).length} bytes`);
            core.setOutput('found', 'true');

      # ── Step 5c: Restore Parquet to State Path ────────────
      # The downloaded artifact is a ZIP archive containing
      # combined_data.parquet — extract it and copy to the
      # exact path recorded in the state file.
      - name: 🔧 Restore Parquet to State Path
        if: steps.check_state.outputs.needs_email2 == 'true'
        run: |
          python - <<'EOF'
          import json, os, shutil, zipfile

          with open("reports/.run_state.json") as f:
              state = json.load(f)

          target = state.get("parquet_file_path", "")
          if not target:
              raise SystemExit("❌ parquet_file_path missing from state.")

          # Resolve old-runner absolute paths to this checkout
          if os.path.isabs(target) and not os.path.exists(target):
              for marker in ("reports/", "reports" + os.sep):
                  idx = target.find(marker)
                  if idx != -1:
                      target = os.path.join(os.getcwd(), target[idx:])
                      break

          zip_path = "_dl/artifact.zip"
          src      = "_dl/combined_data.parquet"

          # Extract parquet from the downloaded artifact ZIP
          if os.path.exists(zip_path):
              with zipfile.ZipFile(zip_path) as zf:
                  members = zf.namelist()
                  member = next(
                      (m for m in members if m.endswith(".parquet")),
                      None
                  )
                  if not member:
                      raise SystemExit(
                          f"❌ No .parquet inside artifact zip. "
                          f"Contents: {members}"
                      )
                  zf.extract(member, "_dl")
                  src = os.path.join("_dl", member)
              print(
                  f"📦 Extracted from artifact: {member} "
                  f"({os.path.getsize(src) / 1048576:.1f} MB)"
              )

          if os.path.exists(src):
              os.makedirs(os.path.dirname(target), exist_ok=True)
              shutil.copyfile(src, target)
              size_mb = os.path.getsize(target) / 1048576
              print(f"✅ Restored parquet → {target} ({size_mb:.1f} MB)")
          elif os.path.exists(target):
              size_mb = os.path.getsize(target) / 1048576
              print(
                  f"ℹ️  No artifact download — using parquet already in "
                  f"checkout: {target} ({size_mb:.1f} MB)"
              )
          else:
              raise SystemExit(
                  "❌ No parquet available: artifact missing AND not in "
                  "checkout.\n   Re-run the Main Workflow to republish data."
              )
          EOF

      # ── Step 6: Reprocess Invoice Data ────────────────────
      # Uses the combined parquet restored from the artifact
      - name: ⚙️ Reprocess Combined Invoice
        if: steps.check_state.outputs.needs_email2 == 'true'
        run: |
          echo "============================================"
          echo "  STEP 2: REPROCESSING COMBINED INVOICE"
          echo "  Using combined parquet from artifact"
          echo "  No raw downloads needed"
          echo "============================================"
          python scripts/reprocess_combined.py

      # ── Step 7: Generate Fresh CRD Report ─────────────────
      - name: 📈 Generate Final CRD Business Report
        if: steps.check_state.outputs.needs_email2 == 'true'
        run: |
          echo "============================================"
          echo "  STEP 3: GENERATING FINAL CRD REPORT"
          echo "  No Not Found sheet — all entities mapped"
          echo "============================================"
          python scripts/generate_report.py

      # ── Step 8: Send Email 2 ──────────────────────────────
      - name: 📧 Send Final Email 2
        if: steps.check_state.outputs.needs_email2 == 'true'
        env:
          GMAIL_SENDER        : ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD  : ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS    : ${{ secrets.RECIPIENT_EMAILS }}
          CC_EMAILS           : ${{ secrets.CC_EMAILS }}
          GITHUB_EVENT_NAME   : ${{ github.event_name }}
        run: |
          echo "============================================"
          echo "  STEP 4: SENDING FINAL EMAIL 2"
          echo "============================================"
          python scripts/email_sender.py email2

      

      
      # ── Step 9: Commit All Updates ────────────────────────
      - name: 💾 Commit Updated Files
        if: steps.check_state.outputs.needs_email2 == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          # Parquet files are NOT committed to git anymore —
          # they travel as the combined-data-latest artifact.
          # Un-track any parquet committed by older versions.
          TRACKED_PARQUET=$(git ls-files "reports/*combined_data_*.parquet" || true)
          if [ -n "$TRACKED_PARQUET" ]; then
            echo "🧹 Un-tracking previously committed parquet files:"
            echo "$TRACKED_PARQUET"
            echo "$TRACKED_PARQUET" | xargs -r git rm --cached -q
          fi

          git add reports/.run_state.json        || true
          git add reports/.current_run_dir.txt   || true
          git add data/                          || true

          find reports/ -name "CRD_Business_Report_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true
          find reports/ -name "Final_Sample_Invoice_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi

          git pull origin HEAD --rebase --autostash

          TRACKED_PARQUET=$(git ls-files "reports/*combined_data_*.parquet" || true)
          if [ -n "$TRACKED_PARQUET" ]; then
            echo "$TRACKED_PARQUET" | xargs -r git rm --cached -q
          fi
          git add reports/.run_state.json        || true
          git add reports/.current_run_dir.txt   || true
          git add data/                          || true
          find reports/ -name "CRD_Business_Report_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true
          find reports/ -name "Final_Sample_Invoice_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ No changes after rebase."
            exit 0
          fi

          RUN_DATE=$(date +'%d-%b-%Y %H:%M IST')
          git commit -m \
            "✅ CRD Final Report — ${RUN_DATE}"
          git push origin HEAD
          echo "✅ Committed and pushed."

      # ── Step 10: Stage Reprocessed Parquet ────────────────
      # Publish the CORRECTED parquet under the same fixed
      # artifact name so the Sheets Workflow (which triggers
      # after this one) picks up the re-mapped data.
      - name: 🗂️ Stage Reprocessed Parquet
        if: steps.check_state.outputs.needs_email2 == 'true'
        run: |
          python - <<'EOF'
          import json, os, shutil

          with open("reports/.run_state.json") as f:
              state = json.load(f)

          src = state.get("parquet_file_path", "")
          if not src:
              raise SystemExit("❌ parquet_file_path missing from state.")

          # Resolve old-runner absolute paths
          if os.path.isabs(src) and not os.path.exists(src):
              for marker in ("reports/", "reports" + os.sep):
                  idx = src.find(marker)
                  if idx != -1:
                      src = os.path.join(os.getcwd(), src[idx:])
                      break

          if not os.path.exists(src):
              raise SystemExit(f"❌ Parquet not found: {src}")

          os.makedirs("artifact_stage", exist_ok=True)
          for old in os.listdir("artifact_stage"):
              os.remove(os.path.join("artifact_stage", old))

          dst = os.path.join("artifact_stage", "combined_data.parquet")
          shutil.copyfile(src, dst)
          size_mb = os.path.getsize(dst) / 1048576
          print(f"✅ Staged reprocessed parquet: {src}")
          print(f"   → {dst} ({size_mb:.1f} MB)")
          EOF

      # ── Step 10b: Upload Complete Data Artifact ───────────
      - name: 📤 Upload Complete Data Artifact
        if: steps.check_state.outputs.needs_email2 == 'true'
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-data-latest
          path: artifact_stage/combined_data.parquet
          retention-days: 15
          if-no-files-found: error

       # NEW - Auto Cleanup (keeps the artifact just uploaded)
      - name: 🧹 Delete Old Artifacts
        if: steps.upload_artifact.outputs.artifact-id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepId = '${{ steps.upload_artifact.outputs.artifact-id }}';
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              if (keepId && String(artifact.id) === keepId) {
                console.log(`Keeping current artifact: ${artifact.name} (${artifact.id})`);
                continue;
              }
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted: ${artifact.name} (${artifact.id})`);
            }
      # ── Step 11: Skip Notice ──────────────────────────────
      - name: ℹ️ Skip Notice
        if: steps.check_state.outputs.needs_email2 == 'false'
        run: |
          echo "============================================"
          echo "  ℹ️  EMAIL 2 NOT REQUIRED"
          echo "  Reasons:"
          echo "  • No Not Found entities OR"
          echo "  • Email 2 already sent OR"
          echo "  • Not_Found_Summary.xlsx not in data/"
          echo "============================================"
