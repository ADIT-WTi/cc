name: CRD Report — Main Workflow (Email 1)

on:
  repository_dispatch:
    types: [run-crd-report]

  workflow_dispatch:
    inputs:
      test_mode:
        description: "true = last 1 month only | false = full production range"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write
  
    steps:
      # ── Step 1: Checkout Repository ──────────────────────
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── Step 2: Setup Python ──────────────────────────────
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Step 3: Install Python Dependencies ───────────────
      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Step 4: Install Playwright Chromium ───────────────
      - name: 🌐 Install Playwright Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2t64 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            libxshmfence1 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            xdg-utils \
            fonts-liberation \
            libglib2.0-0 \
            libpango-1.0-0 \
            libcairo2

          python -m playwright install chromium

          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('about:blank')
              browser.close()
          print('✅ Playwright verified.')
          "

      # ── Step 5: Resolve Run Mode ──────────────────────────
      - name: 🔍 Show Run Mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TEST_MODE="${{ github.event.inputs.test_mode }}"
          else
            TEST_MODE="false"
          fi

          echo "TEST_MODE=${TEST_MODE}" >> $GITHUB_ENV
          echo "Event : ${{ github.event_name }}"
          echo "Mode  : ${TEST_MODE}"

      # ── Step 6: Download Invoice Data ─────────────────────
      - name: 📊 Download Invoice Data
        env:
          WISX_USER_ID: ${{ secrets.WISX_USER_ID }}
          WISX_PASSWORD: ${{ secrets.WISX_PASSWORD }}
          TEST_MODE: ${{ env.TEST_MODE }}
        run: |
          echo "============================================"
          echo "  STEP 1: DOWNLOADING INVOICE DATA"
          echo "  TEST_MODE = ${TEST_MODE}"
          echo "============================================"
          python scripts/download_invoice.py

      # ── Step 7: Process Invoice Data ──────────────────────
      - name: ⚙️ Process Invoice Data
        run: |
          echo "============================================"
          echo "  STEP 2: PROCESSING INVOICE DATA"
          echo "============================================"
          python scripts/process_invoice.py

      # ── Step 8: Generate CRD Business Report ──────────────
      - name: 📈 Generate CRD Business Report
        run: |
          echo "============================================"
          echo "  STEP 3: GENERATING CRD BUSINESS REPORT"
          echo "============================================"
          python scripts/generate_report.py

      # ── Step 9: Send Email 1 ──────────────────────────────
      - name: 📧 Send Email 1
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          CC_EMAILS: ${{ secrets.CC_EMAILS }}
        run: |
          echo "============================================"
          echo "  STEP 4: SENDING EMAIL 1"
          echo "============================================"
          python scripts/email_sender.py email1


      # ── Step 11: Commit Small Output Files Only ───────────
      # NOTE: parquet files are NOT committed to git anymore.
      # They travel between workflows as the
      # `combined-data-latest` artifact (see Step 11b).
      # This keeps git history small and avoids GitHub's
      # 100MB per-file limit as data grows.
      - name: 💾 Commit Output Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          # Remove any parquet files that were committed by
          # older versions of this workflow (one-time cleanup
          # + safety net). Keeps them on disk for this run,
          # but removes them from git tracking.
          TRACKED_PARQUET=$(git ls-files "reports/*combined_data_*.parquet" || true)
          if [ -n "$TRACKED_PARQUET" ]; then
            echo "🧹 Un-tracking previously committed parquet files:"
            echo "$TRACKED_PARQUET"
            echo "$TRACKED_PARQUET" | xargs -r git rm --cached -q
          fi

          # Stage small required files
          git add reports/.run_state.json        || true
          git add reports/.current_run_dir.txt   || true
          git add data/                          || true

          # Final report
          find reports/ -name "CRD_Business_Report_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true

          # Final sample invoice (if generated)
          find reports/ -name "Final_Sample_Invoice_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true

          # Not Found files
          find reports/ -name "Not_Found_Summary.xlsx" \
            -exec git add {} \; 2>/dev/null || true
          find reports/ -name "not_found_data.json" \
            -exec git add {} \; 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ No changes to commit."
            exit 0
          fi

          git pull origin HEAD --rebase --autostash

          # Re-stage after rebase
          TRACKED_PARQUET=$(git ls-files "reports/*combined_data_*.parquet" || true)
          if [ -n "$TRACKED_PARQUET" ]; then
            echo "$TRACKED_PARQUET" | xargs -r git rm --cached -q
          fi
          git add reports/.run_state.json        || true
          git add reports/.current_run_dir.txt   || true
          git add data/                          || true
          find reports/ -name "CRD_Business_Report_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true
          find reports/ -name "Final_Sample_Invoice_*.xlsx" \
            -exec git add {} \; 2>/dev/null || true
          find reports/ -name "Not_Found_Summary.xlsx" \
            -exec git add {} \; 2>/dev/null || true
          find reports/ -name "not_found_data.json" \
            -exec git add {} \; 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "✅ No changes after rebase."
            exit 0
          fi

          if [ "${{ env.TEST_MODE }}" = "true" ]; then
            RUN_DATE=$(date +'%d-%b-%Y %H:%M IST')
            git commit -m "🧪 TEST RUN — ${RUN_DATE}"
          else
            RUN_DATE=$(date +'%d-%b-%Y %H:%M IST')
            git commit -m "📊 CRD Report Output — ${RUN_DATE}"
          fi

          git push origin HEAD
          echo "✅ Files committed and pushed."

      # ── Step 11b: Stage Complete Parquet for Upload ───────
      # Copies the current run's parquet to a stable staging
      # folder under a fixed file name, so the artifact has a
      # predictable structure for the other workflows.
      - name: 🗂️ Stage Complete Parquet
        run: |
          python - <<'EOF'
          import json, os, shutil

          with open("reports/.run_state.json") as f:
              state = json.load(f)

          src = state.get("parquet_file_path", "")
          if not src:
              raise SystemExit("❌ parquet_file_path missing from state.")

          # Resolve old-runner absolute paths
          if os.path.isabs(src) and not os.path.exists(src):
              for marker in ("reports/", "reports" + os.sep):
                  idx = src.find(marker)
                  if idx != -1:
                      src = os.path.join(os.getcwd(), src[idx:])
                      break

          if not os.path.exists(src):
              raise SystemExit(f"❌ Parquet not found: {src}")

          os.makedirs("artifact_stage", exist_ok=True)
          for old in os.listdir("artifact_stage"):
              os.remove(os.path.join("artifact_stage", old))

          dst = os.path.join("artifact_stage", "combined_data.parquet")
          shutil.copyfile(src, dst)
          size_mb = os.path.getsize(dst) / 1048576
          print(f"✅ Staged: {src}")
          print(f"   → {dst} ({size_mb:.1f} MB)")
          EOF

      
      # ── Step 12: Upload Complete Data Artifact ─────────────
      # THE single big-file channel: one parquet, fixed name.
      # Consumed by the Followup Workflow (reprocess) and the
      # Sheets Workflow (push + README download link).
      # Reports/state stay in git — they are small.
      - name: 📤 Upload Complete Data Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: combined-data-latest
          path: artifact_stage/combined_data.parquet
          retention-days: 90
          if-no-files-found: error

      # ── Step 13: Delete Old Artifacts (NEW - Auto Cleanup)
      # Keeps ONLY the artifact just uploaded; deletes every
      # other artifact (including the previous run's
      # combined-data-latest) so storage can never accumulate.
      # Only runs when the upload actually succeeded.
      - name: 🧹 Delete Old Artifacts
        if: steps.upload_artifact.outputs.artifact-id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const keepId = '${{ steps.upload_artifact.outputs.artifact-id }}';
            const { data } = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            for (const artifact of data.artifacts) {
              if (keepId && String(artifact.id) === keepId) {
                console.log(`Keeping current artifact: ${artifact.name} (${artifact.id})`);
                continue;
              }
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
              console.log(`Deleted artifact: ${artifact.name} (${artifact.id})`);
            }
